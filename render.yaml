services:
  - type: web
    name: scanner-incident-map
    runtime: node
    plan: free
    buildCommand: "true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: API_KEY
        generateValue: true
      - key: AREA
        value: ""
      - key: MAX_AGE_HOURS
        value: "24"
